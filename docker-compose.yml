services:
  mongodb:
    image: mongo:8
    container_name: app-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - backend-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend NestJS
  backend:
    build:
      context: ../recipes-back
      dockerfile: Dockerfile
    container_name: app-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_INITDB_DATABASE}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend-network
      - app-network

  # Frontend Angular
  frontend:
    build:
      context: ../recipes-front
      dockerfile: Dockerfile
    container_name: app-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # Local uniquement, HTTP simple
    volumes:
      - uploads_data:/usr/share/nginx/uploads:ro
    depends_on:
      - backend
    networks:
      app-network: {}
      proxy-network:
        aliases:
          - recipes-frontend

networks:
  app-network:
    driver: bridge
  backend-network:
    driver: bridge
    internal: true
  proxy-network:
    external: true

volumes:
  mongodb_data:
  mongodb_config:
  uploads_data:
